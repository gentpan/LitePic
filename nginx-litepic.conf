server {
    listen 8080;
    server_name litepic.local localhost;

    root /Users/gentpan/projects/LitePic;
    index index.php index.html;

    # 日志文件
    access_log /opt/homebrew/var/log/nginx/litepic.access.log;
    error_log /opt/homebrew/var/log/nginx/litepic.error.log;

    # 上传大小限制 — 跟 .user.ini 的 upload_max_filesize=20M 对齐
    client_max_body_size 22m;
    client_body_buffer_size 4m;
    client_body_timeout 600s;

    # 安全：禁止访问敏感文件
    location ~ /\.(env|git|gitignore) {
        deny all;
        return 403;
    }

    location ~ ^/data/ {
        deny all;
        return 403;
    }

    location ~ ^/logs/ {
        deny all;
        return 403;
    }

    # 禁止在 uploads 目录执行 PHP
    location ~ ^/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # WebDAV（/dav）—— 必须放在静态文件正则之前，并且用 ^~ 修饰符。
    #
    # 两个坑：
    #   1. 不加 ^~ 时，/dav/相册/foo.jpg 会先被下面的 \.(jpg|…)$ 正则 location
    #      抢走，nginx 直接去磁盘找文件然后 404；^~ 命中后 nginx 不再检查正则。
    #   2. 静态 location 对 PUT / PROPFIND 这类方法会返回 405，所以 /dav 下的
    #      请求必须无条件交给 PHP，不能走 try_files。
    location ^~ /dav {
        client_max_body_size 22m;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/dav.php;
        fastcgi_param SCRIPT_NAME /dav.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 600;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        # Basic 鉴权必需：部分 PHP-FPM 配置不会自动透传 Authorization
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # 主路由
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
