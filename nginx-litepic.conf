<?php
/**
 * LitePic — Nginx + PHP-FPM 参考配置（含宝塔）
 *
 * 关键：伪静态必须把未命中的路径交给 index.php，否则
 * /gallery /upload /settings 等会直接 404（改密后跳转图库最常见）。
 *
 * ---------- 宝塔面板 ----------
 * 网站 → 设置 → 配置文件，在 server { ... } 内确保有：
 *
 *   location / {
 *       try_files $uri $uri/ /index.php?$query_string;
 *   }
 *
 * 或在「伪静态」里选能回落到 index.php 的规则。改完后重载 Nginx。
 * 仓库根目录还带了 /gallery/index.php 等兼容 shim，可兜底最常见的
 * /gallery /upload；子路径（/settings/xxx、/gallery/page/2）仍依赖 try_files。
 *
 * ---------- 完整示例 ----------
 */
server {
    listen 8080;
    server_name litepic.local localhost;

    root /Users/gentpan/projects/LitePic;
    index index.php index.html;

    # 日志文件
    access_log /opt/homebrew/var/log/nginx/litepic.access.log;
    error_log /opt/homebrew/var/log/nginx/litepic.error.log;

    # 上传大小限制 — 跟 .user.ini 的 upload_max_filesize=20M 对齐
    client_max_body_size 22m;
    client_body_buffer_size 4m;
    client_body_timeout 600s;

    # 安全：禁止访问敏感文件
    location ~ /\.(env|git|gitignore) {
        deny all;
        return 403;
    }

    location ~ ^/data/ {
        deny all;
        return 403;
    }

    location ~ ^/logs/ {
        deny all;
        return 403;
    }

    # 禁止在 uploads 目录执行 PHP
    location ~ ^/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # 主路由 —— 宝塔缺这一段就会出现 /gallery 404
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
